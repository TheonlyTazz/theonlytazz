<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 450" role="img" aria-labelledby="title desc">
  <title id="title">Software engineering and Minecraft modding banner</title>
  <desc id="desc">A dark technical grid with geometric blocks and a violet and cyan radial systems motif.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090d18"/>
      <stop offset="0.6" stop-color="#101a2c"/>
      <stop offset="1" stop-color="#182238"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#2dd4bf" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0.2"/>
      <stop offset="0.5" stop-color="#8b5cf6" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8aa0c8" stroke-opacity="0.08"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="450" fill="url(#background)"/>
  <rect width="1600" height="450" fill="url(#grid)"/>
  <path d="M0 354C360 314 620 372 910 338s470-36 690-8" fill="none" stroke="url(#horizon)" stroke-width="2"/>

  <g fill="none" stroke="#6ee7f9" stroke-opacity="0.18">
    <path d="M0 390H1600M0 410H1600M0 430H1600"/>
    <path d="M790 450L1030 300M970 450L1120 300M1150 450L1210 300M1330 450L1300 300"/>
  </g>

  <g opacity="0.9">
    <path d="M108 286h76v76h-76z" fill="#15263b" stroke="#2dd4bf" stroke-opacity="0.6"/>
    <path d="M184 316h48v46h-48z" fill="#1b2941" stroke="#67e8f9" stroke-opacity="0.35"/>
    <path d="M302 330h92v32h-92z" fill="#111f34" stroke="#8b5cf6" stroke-opacity="0.3"/>
    <path d="M420 300h54v62h-54z" fill="#17263d" stroke="#2dd4bf" stroke-opacity="0.32"/>
  </g>

  <g transform="translate(1250 215)">
    <circle r="204" fill="url(#core)"/>
    <circle r="168" fill="none" stroke="#67e8f9" stroke-opacity="0.22"/>
    <circle r="128" fill="none" stroke="#a78bfa" stroke-opacity="0.42" stroke-dasharray="7 13"/>
    <circle r="88" fill="none" stroke="#67e8f9" stroke-opacity="0.55" stroke-width="2"/>
    <circle r="34" fill="#162b45" stroke="#67e8f9" stroke-opacity="0.8" stroke-width="2"/>
    <path d="M-220 0H220M0-220V220" stroke="#67e8f9" stroke-opacity="0.15"/>
    <path d="M-145-145L145 145M145-145L-145 145" stroke="#a78bfa" stroke-opacity="0.12"/>
    <g filter="url(#glow)" fill="#67e8f9">
      <circle cx="0" cy="-168" r="4"/>
      <circle cx="128" cy="0" r="4"/>
      <circle cx="0" cy="88" r="4"/>
    </g>
    <g fill="#1e3552" stroke="#8b5cf6" stroke-opacity="0.7">
      <path d="M-28-116h56v56h-56z"/>
      <path d="M92-28h56v56h-56z"/>
      <path d="M-148 74h56v56h-56z"/>
    </g>
  </g>

  <g fill="none" stroke-linecap="round">
    <path d="M80 102h176M80 124h104" stroke="#67e8f9" stroke-opacity="0.5" stroke-width="3"/>
    <path d="M80 164h112M80 186h160" stroke="#a78bfa" stroke-opacity="0.38" stroke-width="2"/>
    <path d="M80 224h72" stroke="#fbbf24" stroke-opacity="0.55" stroke-width="2"/>
  </g>
</svg>
